# FinFlow — Docker Compose
# Uso dev:  docker-compose up -d
# Uso prod: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: finflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finflow}
      POSTGRES_USER: ${POSTGRES_USER:-finflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro  # executa scripts na ordem
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command: >
      postgres
        -c shared_buffers=128MB
        -c max_connections=50
        -c effective_cache_size=256MB
        -c work_mem=4MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finflow} -d ${POSTGRES_DB:-finflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finflow_net

  # ── Backend .NET 10 ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finflow_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENV:-Development}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-finflow};Username=${POSTGRES_USER:-finflow};Password=${POSTGRES_PASSWORD}"
      JWT__Secret: ${JWT_SECRET}
      JWT__Issuer: ${JWT_ISSUER:-finflow}
      JWT__Audience: ${JWT_AUDIENCE:-finflow-users}
      JWT__ExpiresInMinutes: ${JWT_EXPIRES_MINUTES:-60}
      GEMINI__ApiKey: ${GEMINI_API_KEY}
      CORS__AllowedOrigins: ${CORS_ORIGINS:-http://localhost:4200}
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - finflow_net

  # ── Nginx + Frontend Angular ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: finflow_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist/finflow/browser:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - finflow_net

networks:
  finflow_net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
